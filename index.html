<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kocham Cię ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
  <style>
    /* Kolory gradientu napisu – animowane płynnie przy zmianie palety */
    @property --g1 { syntax: '<color>'; inherits: true; initial-value: #ff758c; }
    @property --g2 { syntax: '<color>'; inherits: true; initial-value: #ff7eb3; }
    @property --g3 { syntax: '<color>'; inherits: true; initial-value: #ffd1ff; }
    /* Przesunięcie połysku (0 -> 1 = jeden pełny okres gradientu) */
    @property --sh { syntax: '<number>'; inherits: true; initial-value: 0; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --g1: #ff758c;
      --g2: #ff7eb3;
      --g3: #ffd1ff;
      --hs: 160px;
    }

    html, body {
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2b0a18 0%, #0d0208 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      position: relative;
      cursor: pointer;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Tło z unoszącymi się serduszkami */
    #bg { z-index: 0; }
    /* Cząsteczki serca, rozprysk, ślad palca, deszcz serduszek */
    #fx { z-index: 4; }

    /* Przyciemnienie podczas niespodzianki */
    #dim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(20, 0, 8, 0.35) 0%, rgba(4, 0, 2, 0.75) 100%);
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #dim.on { opacity: 1; }

    /* Scena serca */
    .scene {
      position: relative;
      width: calc(var(--hs) * 1.3);
      height: calc(var(--hs) * 1.3);
      z-index: 2;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.55s ease, scale 0.55s cubic-bezier(0.3, 0.7, 0.3, 1);
    }
    .scene.off {
      opacity: 0;
      scale: 0.35;
    }

    .glow {
      position: absolute;
      inset: -12%;
      pointer-events: none;
      background: radial-gradient(circle, rgb(var(--gr, 255 42 109) / 0.5) 0%, rgb(var(--gr, 255 42 109) / 0) 62%);
    }

    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 800px;
    }

    /* Bicie serca (skala z JS) – osobno od obrotu */
    .heart-wrapper {
      position: relative;
      transform-style: preserve-3d;
    }

    .spin {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: rotateX(-12deg) rotateY(0deg);
      animation: spin 9s linear infinite;
      will-change: transform;
    }
    .scene.off .spin { animation-play-state: paused; }

    @keyframes spin {
      from { transform: rotateX(-12deg) rotateY(0deg); }
      to   { transform: rotateX(-12deg) rotateY(360deg); }
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .layer.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .layer.face path { fill: url(#heartGrad); }
    .layer.inner path { fill: color-mix(in srgb, var(--wallc, #ff0844) calc(var(--k) * 100%), #000); }

    /* Boczne ściany wytłoczenia serca */
    .wall {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      background: color-mix(in srgb, var(--wallc, #ff0844) calc(var(--k) * 100%), #000);
    }

    /* Napisy */
    .text-container {
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      min-height: 110px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .grad {
      position: relative;
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
      letter-spacing: 2px;
      max-width: 100%;
      text-shadow: 0 0 30px rgba(255, 117, 140, 0.35);
      transition: --g1 1.4s ease, --g2 1.4s ease, --g3 1.4s ease;
      animation: shimmer 5s linear infinite;
    }

    #love-text {
      font-size: clamp(3.2rem, 11vw, 5rem);
      line-height: 1.15;
      animation: shimmer 5s linear infinite, textFloat 3s ease-in-out infinite;
    }

    /* Wyraz nie jest łamany w środku, zdanie zawija się między wyrazami */
    .w {
      display: inline-block;
      white-space: nowrap;
    }

    /* Litera ma własny gradient o rozmiarze całego napisu (--tw/--th) przesunięty o pozycję litery (--ox/--oy),
       dzięki czemu gradient wygląda spójnie na całym napisie. Padding chroni zawijasy czcionki przed obcięciem. */
    .ch {
      display: inline-block;
      padding: 0.14em 0.12em;
      margin: -0.14em -0.12em;
      color: transparent;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g1));
      background-repeat: repeat-x;
      background-size: var(--tw, 100%) var(--th, 100%);
      background-position: calc(var(--ox, 0px) - var(--sh) * var(--tw, 0px)) var(--oy, 0px);
      -webkit-background-clip: text;
      background-clip: text;
      animation: letterIn 0.65s cubic-bezier(0.2, 0.8, 0.25, 1) both;
      animation-delay: calc(var(--i, 0) * var(--step, 55ms));
    }

    .out .ch {
      animation: letterOut 0.38s ease forwards;
      animation-delay: calc(var(--i, 0) * 12ms);
    }

    @keyframes letterIn {
      from { opacity: 0; transform: translateY(16px) scale(0.88); filter: blur(7px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    @keyframes letterOut {
      from { opacity: 1; transform: none; filter: blur(0); }
      to   { opacity: 0; transform: translateY(-10px) scale(0.92); filter: blur(5px); }
    }

    @keyframes shimmer {
      to { --sh: 1; }
    }

    @keyframes textFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -6px; }
    }

    /* Niespodzianka */
    #surprise {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      pointer-events: none;
    }

    #surprise-text {
      font-size: clamp(2.5rem, 10.5vw, 5rem);
      line-height: 1.15;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: none;
      isolation: isolate;
      /* ciemna poświata za literami dla kontrastu na tle deszczu */
      filter: drop-shadow(0 0 8px rgba(8, 0, 4, 0.95)) drop-shadow(0 0 22px rgba(8, 0, 4, 0.8));
    }

    /* Przygaszenie deszczu w obszarze tekstu (element leży nad canvasem z deszczem) */
    #surprise-text::before {
      content: '';
      position: absolute;
      inset: -0.35em -0.4em;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(8, 0, 4, 0.7) 0%, rgba(8, 0, 4, 0.45) 55%, rgba(8, 0, 4, 0) 100%);
      pointer-events: none;
    }
    #surprise-text:empty::before { display: none; }

    .hint {
      position: absolute;
      bottom: 28px;
      z-index: 2;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      transition: opacity 0.7s ease;
    }
    .hint.gone { opacity: 0; }
    .hint span {
      display: inline-block;
      animation: pulseHint 2.5s infinite;
      transition: opacity 0.25s ease;
    }
    .hint.swap span { opacity: 0; animation: none; }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; transform: rotateX(-12deg) rotateY(-28deg); }
      .grad, #love-text { animation: none; }
      .ch { animation-name: letterInSoft; }
      .out .ch { animation-name: letterOutSoft; }
      .hint span { animation: none; opacity: 0.6; }
      @keyframes letterInSoft { from { opacity: 0; } to { opacity: 1; } }
      @keyframes letterOutSoft { from { opacity: 1; } to { opacity: 0; } }
    }
  </style>
</head>
<body>

  <!-- Definicje SVG: gradient serca i kontur do próbkowania ścian (nie display:none, żeby gradient działał) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop id="stop1" offset="0%" stop-color="#ff0844" />
        <stop id="stop2" offset="100%" stop-color="#ffb199" />
      </linearGradient>
      <path id="outline" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
    </defs>
  </svg>

  <canvas id="bg"></canvas>
  <div id="dim"></div>

  <div class="scene" id="scene">
    <div class="glow" id="glow"></div>
    <div class="stage">
      <div class="heart-wrapper" id="heart-wrapper">
        <div class="spin" id="spin"></div>
      </div>
    </div>
  </div>

  <div class="text-container">
    <h1 id="love-text" class="grad"></h1>
  </div>

  <div class="hint" id="hint"><span id="hint-text">Dotknij ekranu ✨</span></div>

  <canvas id="fx"></canvas>

  <div id="surprise"><h2 id="surprise-text" class="grad"></h2></div>

  <script>
    // Niespodzianka: po tylu dotknięciach pojawia się tekst poniżej. Obie wartości można podmienić.
    const SURPRISE_TAPS = 15;
    const SURPRISE_TEXT = "Asiu, jesteś najpiękniejszym, co mnie w życiu spotkało";

    const targetName = "Asiu";

    // Bazy zdań – mogą pojawiać się z imieniem lub bez, losowo
    const basePhrases = [
      "Kocham Cię",
      "Jesteś moim światem",
      "Na zawsze razem ❤️",
      "Myślę o Tobie cały czas",
      "Dziękuję, że jesteś",
      "Jesteś moim szczęściem",
      "Moje serce bije dla Ciebie"
    ];

    function buildRandomMessage(previousText) {
      let candidate = "";
      let guard = 0;

      do {
        const phrase = basePhrases[Math.floor(Math.random() * basePhrases.length)];
        // Około 50% szans, że pojawi się imię "Asiu"
        const includeName = Math.random() < 0.5;

        if (includeName) {
          // Czasem samo imię / z imieniem na końcu lub początku
          const mode = Math.floor(Math.random() * 3);
          if (mode === 0) {
            candidate = `${phrase}, ${targetName}`;
          } else if (mode === 1) {
            candidate = `${targetName}, ${phrase.charAt(0).toLowerCase() + phrase.slice(1)}`;
          } else {
            candidate = `${targetName} ❤️`;
          }
        } else {
          candidate = phrase;
        }
        guard++;
      } while (candidate === previousText && guard < 15);

      return candidate;
    }

    const palettes = [
      { c1: '#ff0844', c2: '#ffb199', glow: '#ff2a6d', textGrad: 'linear-gradient(90deg, #ff758c, #ff7eb3, #ffd1ff, #ff758c)' },
      { c1: '#f83600', c2: '#f9d423', glow: '#ff9a00', textGrad: 'linear-gradient(90deg, #f6d365, #fda085, #fff1eb, #f6d365)' },
      { c1: '#b721ff', c2: '#21d4fd', glow: '#b721ff', textGrad: 'linear-gradient(90deg, #e0c3fc, #8ec5fc, #ffffff, #e0c3fc)' },
      { c1: '#ff057c', c2: '#8d0b93', glow: '#ff057c', textGrad: 'linear-gradient(90deg, #ff9a9e, #fecfef, #ffffff, #ff9a9e)' },
      { c1: '#e6b980', c2: '#eacda3', glow: '#e6b980', textGrad: 'linear-gradient(90deg, #f3e7e9, #e3eeff, #ffd1ff, #f3e7e9)' }
    ];

    /* ---------- Pomocnicze ---------- */

    const rand = Math.random;
    const TAU = Math.PI * 2;
    const DRAG_THRESHOLD = 8;   // px od pointerdown, po przekroczeniu gest to przeciągnięcie, nie tap

    const reducedQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    let reduced = reducedQuery.matches;

    const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
    const mixRgb = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    const lighten = (c, t) => mixRgb(c, [255, 255, 255], t);
    const rgbStr = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

    const root = document.documentElement;
    const sceneEl = document.getElementById('scene');
    const glowEl = document.getElementById('glow');
    const wrapEl = document.getElementById('heart-wrapper');
    const spinEl = document.getElementById('spin');
    const stop1 = document.getElementById('stop1');
    const stop2 = document.getElementById('stop2');
    const loveTextEl = document.getElementById('love-text');
    const surpriseEl = document.getElementById('surprise-text');
    const dimEl = document.getElementById('dim');
    const hintEl = document.getElementById('hint');
    const hintTextEl = document.getElementById('hint-text');
    const bgCanvas = document.getElementById('bg');
    const fxCanvas = document.getElementById('fx');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCtx = fxCanvas.getContext('2d');

    // Kształty rysowane na canvasie (współrzędne wyśrodkowane, szerokość 32)
    const HEART_D = document.getElementById('outline').getAttribute('d');
    const HEART = new Path2D();
    HEART.addPath(new Path2D(HEART_D), new DOMMatrix().translate(-16, -14.8));
    const STAR = new Path2D();
    STAR.moveTo(0, -16);
    STAR.quadraticCurveTo(2, -2, 16, 0);
    STAR.quadraticCurveTo(2, 2, 0, 16);
    STAR.quadraticCurveTo(-2, 2, -16, 0);
    STAR.quadraticCurveTo(-2, -2, 0, -16);
    STAR.closePath();

    let W = 0, H = 0, dpr = 1;
    let T = 0;   // czas animacji w sekundach

    function drawShape(c, path, x, y, size, rot) {
      const s = size / 32 * dpr;
      const cs = Math.cos(rot) * s, sn = Math.sin(rot) * s;
      c.setTransform(cs, sn, -sn, cs, x * dpr, y * dpr);
      c.fill(path);
    }

    /* ---------- Paleta (płynne przejścia kolorów) ---------- */

    let paletteIndex = 0;
    const cur = {}, tgt = {};
    let colorsMoving = true;

    function applyPalette(idx, instant) {
      const p = palettes[idx];
      tgt.c1 = hexToRgb(p.c1);
      tgt.c2 = hexToRgb(p.c2);
      tgt.glow = hexToRgb(p.glow);
      // Kolory gradientu napisu z definicji textGrad – CSS płynnie je animuje (@property)
      const tc = p.textGrad.match(/#[0-9a-f]{6}/gi);
      root.style.setProperty('--g1', tc[0]);
      root.style.setProperty('--g2', tc[1]);
      root.style.setProperty('--g3', tc[2]);
      if (instant) {
        for (const k of ['c1', 'c2', 'glow']) cur[k] = tgt[k].slice();
      }
      colorsMoving = true;
    }

    function stepColors(dt) {
      if (!colorsMoving) return false;
      const k = 1 - Math.exp(-dt * 3.2);
      let maxd = 0;
      for (const key of ['c1', 'c2', 'glow']) {
        for (let i = 0; i < 3; i++) {
          const d = tgt[key][i] - cur[key][i];
          cur[key][i] += d * k;
          maxd = Math.max(maxd, Math.abs(d));
        }
      }
      if (maxd < 0.4) {
        for (const key of ['c1', 'c2', 'glow']) cur[key] = tgt[key].slice();
        colorsMoving = false;
      }
      return true;
    }

    function updateHeartColors() {
      stop1.setAttribute('stop-color', rgbStr(cur.c1));
      stop2.setAttribute('stop-color', rgbStr(cur.c2));
      sceneEl.style.setProperty('--wallc', rgbStr(cur.c1));
      sceneEl.style.setProperty('--gr', `${cur.glow[0] | 0} ${cur.glow[1] | 0} ${cur.glow[2] | 0}`);
    }

    function nextPalette() {
      paletteIndex = (paletteIndex + 1) % palettes.length;
      applyPalette(paletteIndex);
    }

    applyPalette(0, true);
    updateHeartColors();

    // Automatyczna płynna zmiana kolorów co 4 sekundy
    setInterval(() => {
      if (!document.hidden) nextPalette();
    }, 4000);

    /* ---------- Napisy: pisanie litera po literze ---------- */

    const segmenter = window.Intl && Intl.Segmenter ? new Intl.Segmenter('pl', { granularity: 'grapheme' }) : null;
    const graphemes = s => segmenter ? Array.from(segmenter.segment(s), x => x.segment) : Array.from(s);

    // Gradient każdej litery ma rozmiar całego napisu i jest przesunięty o pozycję litery
    function fitGradient(el) {
      if (!el.firstChild) return;
      el.style.setProperty('--tw', Math.max(el.offsetWidth, 1) * 1.5 + 'px');
      el.style.setProperty('--th', Math.max(el.offsetHeight, 1) + 'px');
      for (const ch of el.querySelectorAll('.ch')) {
        ch.style.setProperty('--ox', -ch.offsetLeft + 'px');
        ch.style.setProperty('--oy', -ch.offsetTop + 'px');
      }
    }

    function typeInto(el, text, step) {
      el.textContent = '';
      el.classList.remove('out');
      el.setAttribute('aria-label', text);
      el.style.setProperty('--step', step + 'ms');
      let i = 0;
      text.split(' ').forEach((word, wi) => {
        if (wi) el.appendChild(document.createTextNode(' '));
        const w = document.createElement('span');
        w.className = 'w';
        w.setAttribute('aria-hidden', 'true');
        for (const g of graphemes(word)) {
          const c = document.createElement('span');
          c.className = 'ch';
          c.textContent = g;
          c.style.setProperty('--i', i++);
          w.appendChild(c);
        }
        el.appendChild(w);
      });
      fitGradient(el);
    }

    const textStep = () => reduced ? 22 : 55;
    let textTimer = 0;
    let currentMsg = buildRandomMessage("");

    // Płynne zniknięcie starego napisu, potem pisanie nowego
    function setLoveText(msg) {
      currentMsg = msg;
      clearTimeout(textTimer);
      if (loveTextEl.firstChild) {
        loveTextEl.classList.add('out');
        textTimer = setTimeout(() => typeInto(loveTextEl, msg, textStep()), 420);
      } else {
        typeInto(loveTextEl, msg, textStep());
      }
    }

    typeInto(loveTextEl, currentMsg, textStep());

    /* ---------- Serce 3D z grubością (wariant A) ---------- */

    const NS = 'http://www.w3.org/2000/svg';
    let heartSize = 0;

    function buildHeart3D(hs) {
      heartSize = hs;
      const S = hs / 32;
      const h = 29.6 * S;
      const T3 = hs * 0.2;           // grubość serca
      const LAYERS = 12;
      wrapEl.style.width = hs + 'px';
      wrapEl.style.height = h + 'px';
      spinEl.textContent = '';

      // Warstwy w osi Z: przód i tył z gradientem, wewnętrzne coraz ciemniejsze ku środkowi
      for (let i = 0; i < LAYERS; i++) {
        const z = T3 / 2 - T3 * i / (LAYERS - 1);
        const face = i === 0 || i === LAYERS - 1;
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 32 29.6');
        svg.setAttribute('class', 'layer ' + (face ? 'face' : 'inner'));
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', HEART_D);
        svg.appendChild(p);
        if (face) {
          svg.style.transform = i === 0 ? `translateZ(${z}px)` : `translateZ(${z}px) rotateY(180deg)`;
        } else {
          const mid = 1 - Math.abs(2 * i / (LAYERS - 1) - 1);   // 0 na brzegach, 1 w środku
          svg.style.setProperty('--k', (0.9 - 0.5 * mid).toFixed(2));
          svg.style.transform = `translateZ(${z}px)`;
        }
        spinEl.appendChild(svg);
      }

      // Ściany boczne: wąskie prostokąty wzdłuż konturu, żeby serce nie znikało przy obrocie o 90°
      const outline = document.getElementById('outline');
      const total = outline.getTotalLength();
      const N = 44;
      let prev = outline.getPointAtLength(0);
      for (let i = 1; i <= N; i++) {
        const q = outline.getPointAtLength(total * i / N);
        const dx = (q.x - prev.x) * S, dy = (q.y - prev.y) * S;
        const len = Math.hypot(dx, dy);
        const ang = Math.atan2(dy, dx);
        const wall = document.createElement('div');
        wall.className = 'wall';
        wall.style.width = (len + 0.8) + 'px';
        wall.style.height = T3 + 'px';
        wall.style.setProperty('--k', (0.55 + 0.3 * (0.5 + 0.5 * Math.cos(ang * 2 - 0.8))).toFixed(2));
        wall.style.transform = `translate3d(${prev.x * S}px, ${prev.y * S}px, 0) rotateZ(${ang}rad) rotateX(90deg) translateY(${-T3 / 2}px)`;
        spinEl.appendChild(wall);
        prev = q;
      }
    }

    /* ---------- Bicie serca: lub-dub ---------- */

    let beatPhase = 0;
    function beatValue(ph) {
      const g = (c, w) => { const d = (ph - c) / w; return Math.exp(-d * d); };
      return Math.max(g(0.1, 0.05), 0.72 * g(0.3, 0.055));
    }

    /* ---------- Serce z cząsteczek (wariant B) ---------- */

    let variant = 'A';
    let pstate = 'off';     // off | in | out
    let pAlpha = 0;
    let hp = [];
    let hpBuckets = [];
    const BUCKETS = 6;
    let hcx = 0, hcy = 0, baseCx = 0, baseCy = 0, shiftY = 0, heartK = 1;   // heartK: skala serca w niespodziance

    // Kontur serca (równanie parametryczne) przepróbkowany równomiernie po długości łuku
    function heartPoly(n) {
      const raw = [];
      for (let i = 0; i <= 2000; i++) {
        const t = i / 2000 * TAU;
        raw.push([16 * Math.pow(Math.sin(t), 3),
          13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)]);
      }
      const cum = [0];
      for (let i = 1; i < raw.length; i++) cum.push(cum[i - 1] + Math.hypot(raw[i][0] - raw[i - 1][0], raw[i][1] - raw[i - 1][1]));
      const poly = [];
      let j = 1;
      for (let i = 0; i < n; i++) {
        const d = cum[cum.length - 1] * i / n;
        while (cum[j] < d) j++;
        poly.push(raw[j]);
      }
      return poly;
    }

    function insidePoly(poly, x, y) {
      let inside = false;
      for (let i = 0, k = poly.length - 1; i < poly.length; k = i++) {
        const a = poly[i], b = poly[k];
        if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
      }
      return inside;
    }

    function makeHeartParticles() {
      const n = reduced ? 300 : 620;
      const poly = heartPoly(300);
      hp = [];
      hpBuckets = Array.from({ length: BUCKETS }, () => []);
      for (let i = 0; i < n; i++) {
        const contour = i < n * 0.38;   // kontur jest gęstszy niż wnętrze
        let ux, uy;
        if (contour) {
          const q = poly[Math.floor(rand() * poly.length)];
          ux = q[0] + (rand() - 0.5) * 0.7;
          uy = q[1] + (rand() - 0.5) * 0.7;
        } else {
          do {
            ux = (rand() * 2 - 1) * 16;
            uy = -17 + rand() * 29;
          } while (!insidePoly(poly, ux, uy));
        }
        const p = {
          hx: ux, hy: -(uy + 2.5),   // przesunięcie względem środka, y w dół
          x: 0, y: 0, vx: 0, vy: 0,
          r: 0.7 + rand() * 1.3, ph: rand() * TAU,
          a: contour ? 0.65 + rand() * 0.35 : 0.35 + rand() * 0.5
        };
        hp.push(p);
        hpBuckets[Math.floor(rand() * BUCKETS)].push(p);
      }
    }

    function startParticles() {
      for (const p of hp) {
        const a = rand() * TAU;
        const rad = rand() * heartSize * 0.18;
        const sp = 60 + rand() * 220;
        p.x = hcx + Math.cos(a) * rad;
        p.y = hcy + Math.sin(a) * rad;
        p.vx = Math.cos(a) * sp;
        p.vy = Math.sin(a) * sp;
      }
      pstate = 'in';
      pAlpha = 0;
    }

    function pushParticles(x, y) {
      if (pstate !== 'in') return;
      const R = Math.max(110, heartSize * 0.8);
      for (const p of hp) {
        const dx = p.x - x, dy = p.y - y;
        const d = Math.hypot(dx, dy);
        if (d < R && d > 0.5) {
          const f = (1 - d / R) * 420;
          p.vx += dx / d * f;
          p.vy += dy / d * f;
        }
      }
    }

    function updateParticles(dt, beat, amp) {
      if (pstate === 'off') return;
      const out = pstate === 'out';
      pAlpha = Math.min(1, Math.max(0, pAlpha + (out ? -dt / 0.7 : dt / 0.6)));
      if (out && pAlpha <= 0) { pstate = 'off'; return; }
      const s = heartSize / 32 * heartK * (1 + amp * beat);
      const k = out ? 80 : 50, c = out ? 13 : 6.5;
      const R = Math.max(70, heartSize * 0.55), R2 = R * R;
      const touching = ptr.id !== null;
      for (const p of hp) {
        const tx = out ? hcx : hcx + p.hx * s;
        const ty = out ? hcy : hcy + p.hy * s;
        let ax = (tx - p.x) * k - p.vx * c;
        let ay = (ty - p.y) * k - p.vy * c;
        if (touching && !out) {
          const dx = p.x - ptr.x, dy = p.y - ptr.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < R2 && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const f = (1 - d / R);
            const m = f * f * 18000 / d;
            ax += dx * m;
            ay += dy * m;
          }
        }
        p.vx += ax * dt;
        p.vy += ay * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }

    function drawParticles() {
      if (pstate === 'off') return;
      const c = fxCtx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(hcx, hcy, 0, hcx, hcy, heartSize * 0.95);
      g.addColorStop(0, `rgba(${cur.glow[0] | 0},${cur.glow[1] | 0},${cur.glow[2] | 0},${0.2 * pAlpha})`);
      g.addColorStop(1, `rgba(${cur.glow[0] | 0},${cur.glow[1] | 0},${cur.glow[2] | 0},0)`);
      c.globalAlpha = 1;
      c.fillStyle = g;
      c.fillRect(hcx - heartSize, hcy - heartSize, heartSize * 2, heartSize * 2);
      const rs = Math.max(0.8, heartSize / 160);
      for (let b = 0; b < BUCKETS; b++) {
        c.fillStyle = rgbStr(lighten(mixRgb(cur.c1, cur.c2, b / (BUCKETS - 1)), 0.3));
        const list = hpBuckets[b];
        for (let i = 0; i < list.length; i++) {
          const p = list[i];
          c.globalAlpha = Math.min(1, p.a * (0.7 + 0.3 * Math.sin(T * 3.1 + p.ph)) * pAlpha);
          c.beginPath();
          c.arc(p.x, p.y, p.r * rs, 0, TAU);
          c.fill();
        }
      }
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }

    /* ---------- Przełączanie wariantów ---------- */

    let showTimer = 0;
    function setVariant(v, instant) {
      variant = v;
      clearTimeout(showTimer);
      if (v === 'B') {
        sceneEl.classList.add('off');
        startParticles();
      } else {
        if (pstate !== 'off') pstate = 'out';
        // Serce SVG pojawia się, gdy cząsteczki zbiegną się do środka
        showTimer = setTimeout(() => { if (variant === 'A') sceneEl.classList.remove('off'); }, instant ? 0 : 450);
      }
    }

    /* ---------- Tło: unoszące się serduszka z paralaksą ---------- */

    let bgHearts = [];
    function makeBgHeart(initial) {
      const d = 0.15 + rand() * 0.85;       // głębia: małe = dalekie, wolniejsze i bledsze
      const size = 7 + d * d * 28;
      return {
        d, size,
        x: rand() * W,
        y: initial ? rand() * H : H + size,
        v: 8 + d * 36,
        a: 0.07 + d * 0.3,
        amp: 5 + d * 16,
        sf: 0.4 + rand() * 0.6,
        ph: rand() * TAU,
        bias: rand()
      };
    }

    function drawBg(dt) {
      const c = bgCtx;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      for (let i = 0; i < bgHearts.length; i++) {
        const h = bgHearts[i];
        h.y -= h.v * dt;
        if (h.y < -h.size) bgHearts[i] = makeBgHeart(false);
        const x = h.x + Math.sin(T * h.sf + h.ph) * h.amp;
        const rot = Math.sin(T * h.sf * 0.8 + h.ph) * 0.25;
        c.globalAlpha = h.a;
        c.fillStyle = rgbStr(lighten(mixRgb(cur.c1, cur.c2, h.bias), 0.15));
        drawShape(c, HEART, x, h.y, h.size, rot);
      }
      c.globalAlpha = 1;
    }

    /* ---------- Rozprysk, ślad palca, deszcz serduszek ---------- */

    const sprites = [];
    const maxSprites = () => reduced ? 220 : 420;

    function pickColor(lightAmt) {
      const r = rand();
      const base = r < 0.4 ? cur.c1 : r < 0.8 ? cur.c2 : cur.glow;
      return lighten(base, lightAmt + rand() * 0.3);
    }

    function addSprite(o) {
      if (sprites.length >= maxSprites()) return;
      sprites.push(Object.assign({ vx: 0, vy: 0, rot: 0, vr: 0, g: 0, drag: 0, sway: 0, sf: 0, ph: 0, a: 1, fade: true, glow: false }, o));
    }

    function spawnBurst(x, y) {
      const n = reduced ? 8 : 16;
      for (let i = 0; i < n; i++) {
        const ang = rand() * TAU, sp = 140 + rand() * 260;
        const heart = rand() < 0.6;
        const life = 0.9 + rand() * 0.7;
        addSprite({
          x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 120,
          rot: rand() * TAU, vr: (rand() - 0.5) * 10,
          size: heart ? 9 + rand() * 12 : 7 + rand() * 9,
          life, max: life, g: 620, drag: 1.6,
          shape: heart ? HEART : STAR, col: pickColor(0.1), glow: true
        });
      }
    }

    // Ślad palca: większe, jasne serduszka i iskry z poświatą (rozprysk tapu jest mniejszy i kolorowy)
    function spawnTrail(x, y) {
      const heart = rand() < 0.6;
      addSprite({
        x: x + (rand() - 0.5) * 10, y: y + (rand() - 0.5) * 10,
        vx: (rand() - 0.5) * 36, vy: -6 - rand() * 22,
        rot: (rand() - 0.5) * 1.2, vr: (rand() - 0.5) * 2.5,
        size: heart ? 12 + rand() * 12 : 10 + rand() * 10,
        life: 1, max: 1, drag: 1.8,
        shape: heart ? HEART : STAR, col: pickColor(0.45), a: 1, glow: true
      });
    }

    // Ciągła świecąca smuga za palcem
    const streak = [];
    function addStreak(x, y, brk) {
      streak.push({ x, y, t: 1, brk });
      if (streak.length > 120) streak.shift();
    }

    function drawStreak(dt) {
      let n = 0;
      for (let i = 0; i < streak.length; i++) {
        streak[i].t -= dt;
        if (streak[i].t > 0) streak[n++] = streak[i];
      }
      streak.length = n;
      if (n < 2) return;
      const c = fxCtx;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.globalCompositeOperation = 'lighter';
      c.lineCap = 'round';
      c.lineJoin = 'round';
      const glow = lighten(cur.glow, 0.2), core = lighten(cur.c2, 0.7);
      for (const pass of [0, 1]) {
        c.strokeStyle = rgbStr(pass ? core : glow);
        for (let i = 1; i < n; i++) {
          const p = streak[i], q = streak[i - 1];
          if (p.brk) continue;
          c.globalAlpha = Math.min(p.t, q.t) * (pass ? 0.85 : 0.3);
          c.lineWidth = (pass ? 3.5 : 14) * (0.35 + 0.65 * p.t);
          c.beginPath();
          c.moveTo(q.x, q.y);
          c.lineTo(p.x, p.y);
          c.stroke();
        }
      }
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }

    function spawnRain() {
      const size = 9 + rand() * 20;
      addSprite({
        x: rand() * W, y: -size,
        vy: 110 + size * 9 + rand() * 60,
        rot: (rand() - 0.5) * 0.8, vr: (rand() - 0.5) * 1.5,
        size, life: Infinity, max: 1, fade: false,
        a: 0.5 + rand() * 0.5, sway: 14 + rand() * 24, sf: 1 + rand() * 1.5, ph: rand() * TAU,
        shape: HEART, col: pickColor(0.05)
      });
    }

    function updateDrawSprites(dt) {
      const c = fxCtx;
      c.globalCompositeOperation = 'lighter';
      let n = 0;
      for (let i = 0; i < sprites.length; i++) {
        const s = sprites[i];
        s.life -= dt;
        if (s.g) s.vy += s.g * dt;
        if (s.drag) { const k = Math.exp(-s.drag * dt); s.vx *= k; s.vy *= k; }
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        if (s.sway) s.x += Math.cos(T * s.sf + s.ph) * s.sway * dt;
        s.rot += s.vr * dt;
        if (s.life <= 0 || s.y > H + s.size) continue;   // wygasłe usuwamy z tablicy
        sprites[n++] = s;
        const al = s.a * (s.fade ? s.life / s.max : 1);
        c.fillStyle = rgbStr(s.col);
        if (s.glow) {
          c.globalAlpha = al * 0.25;
          drawShape(c, s.shape, s.x, s.y, s.size * 1.9, s.rot);
        }
        c.globalAlpha = al;
        drawShape(c, s.shape, s.x, s.y, s.size, s.rot);
      }
      sprites.length = n;
      c.globalAlpha = 1;
      c.globalCompositeOperation = 'source-over';
    }

    /* ---------- Niespodzianka ---------- */

    const surprise = { on: false, rain: 0, acc: 0, closableAt: 0 };
    let surpriseTimer = 0;
    let tapCount = 0;

    function startSurprise() {
      surprise.on = true;
      surprise.rain = 6;
      surprise.acc = 0;
      clearTimeout(textTimer);
      if (loveTextEl.firstChild) loveTextEl.classList.add('out');
      dimEl.classList.add('on');
      const step = reduced ? 30 : 75;
      // Zamknięcie możliwe dopiero po dopisaniu tekstu + 1 s (szybkie stukanie nie zamknie jej od razu)
      surprise.closableAt = performance.now() + 700 + graphemes(SURPRISE_TEXT).length * step + 1000;
      surpriseTimer = setTimeout(() => typeInto(surpriseEl, SURPRISE_TEXT, step), 700);
    }

    function endSurprise() {
      surprise.on = false;
      clearTimeout(surpriseTimer);
      dimEl.classList.remove('on');
      if (surpriseEl.firstChild) surpriseEl.classList.add('out');
      surpriseTimer = setTimeout(() => { surpriseEl.textContent = ''; }, 450);
      clearTimeout(textTimer);
      textTimer = setTimeout(() => {
        currentMsg = buildRandomMessage(currentMsg);
        typeInto(loveTextEl, currentMsg, textStep());
      }, 450);
    }

    /* ---------- Podpowiedź ---------- */

    let hintStage = 0;   // 0 - dotknij, 1 - przeciągnij, 2 - ukryta
    function hintAfterTap() {
      if (hintStage !== 0) return;
      hintStage = 1;
      hintEl.classList.add('swap');
      setTimeout(() => {
        hintTextEl.textContent = 'Przeciągnij palcem ✨';
        hintEl.classList.remove('swap');
      }, 260);
    }
    function hintAfterDrag() {
      if (hintStage === 2) return;
      hintStage = 2;
      hintEl.classList.add('gone');
    }

    /* ---------- Dotyk: tap i przeciąganie (Pointer Events) ---------- */

    const ptr = { id: null, sx: 0, sy: 0, x: 0, y: 0, lx: 0, ly: 0, dragging: false };

    function onTap(x, y) {
      spawnBurst(x, y);
      pushParticles(x, y);
      if (surprise.on) {
        if (performance.now() < surprise.closableAt) return;
        endSurprise();
        tapCount = 0;
        return;
      }
      tapCount++;
      hintAfterTap();
      if (tapCount >= SURPRISE_TAPS) {
        startSurprise();
        return;
      }
      if (rand() < 0.35) setVariant(variant === 'A' ? 'B' : 'A');
      setLoveText(buildRandomMessage(currentMsg));
      nextPalette();
    }

    function emitTrail(x, y) {
      addStreak(x, y, false);
      const dist = Math.hypot(x - ptr.lx, y - ptr.ly);
      const steps = Math.min(12, Math.floor(dist / 6));   // gęstość zależy od przebytej odległości
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        spawnTrail(ptr.lx + (x - ptr.lx) * t, ptr.ly + (y - ptr.ly) * t);
      }
      if (steps > 0) {
        ptr.lx = x;
        ptr.ly = y;
      }
    }

    document.addEventListener('pointerdown', e => {
      if (ptr.id !== null || !e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
      ptr.id = e.pointerId;
      ptr.sx = ptr.x = ptr.lx = e.clientX;
      ptr.sy = ptr.y = ptr.ly = e.clientY;
      ptr.dragging = false;
    });

    document.addEventListener('pointermove', e => {
      if (e.pointerId !== ptr.id) return;
      ptr.x = e.clientX;
      ptr.y = e.clientY;
      if (!ptr.dragging) {
        if (Math.hypot(ptr.x - ptr.sx, ptr.y - ptr.sy) < DRAG_THRESHOLD) return;
        ptr.dragging = true;
        hintAfterDrag();
        addStreak(ptr.sx, ptr.sy, true);
      }
      emitTrail(ptr.x, ptr.y);
    });

    document.addEventListener('pointerup', e => {
      if (e.pointerId !== ptr.id) return;
      const wasDrag = ptr.dragging;
      ptr.id = null;
      if (!wasDrag) onTap(e.clientX, e.clientY);
    });

    // Przerwany gest (anulowanie, kursor opuścił okno) kończymy bez tapu; inne palce ignorujemy
    const abortGesture = e => {
      if (e.pointerId === ptr.id) ptr.id = null;
    };
    document.addEventListener('pointercancel', abortGesture);
    document.documentElement.addEventListener('pointerleave', abortGesture);

    document.addEventListener('contextmenu', e => e.preventDefault());

    /* ---------- Rozmiar i układ ---------- */

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const oldW = W;
      W = window.innerWidth;
      H = window.innerHeight;
      for (const cv of [bgCanvas, fxCanvas]) {
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
      }
      const hs = Math.round(Math.max(120, Math.min(200, W * 0.44, H * 0.27)));
      root.style.setProperty('--hs', hs + 'px');
      if (hs !== heartSize) buildHeart3D(hs);
      updateHeartColors();

      const r = sceneEl.getBoundingClientRect();
      baseCx = r.left + r.width / 2;
      baseCy = r.top + r.height / 2 - shiftY;
      hcx = baseCx;
      hcy = baseCy + shiftY;

      if (!bgHearts.length || oldW === 0) {
        bgHearts = Array.from({ length: reduced ? 14 : 30 }, () => makeBgHeart(true));
      } else {
        for (const h of bgHearts) if (h.x > W) h.x = rand() * W;
      }
      fitGradient(loveTextEl);
      fitGradient(surpriseEl);
    }

    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 120);
    });

    if (document.fonts) {
      document.fonts.ready.then(() => { fitGradient(loveTextEl); fitGradient(surpriseEl); });
      document.fonts.addEventListener('loadingdone', () => { fitGradient(loveTextEl); fitGradient(surpriseEl); });
    }

    reducedQuery.addEventListener('change', e => {
      reduced = e.matches;
      makeHeartParticles();
      if (variant === 'B') startParticles();
      bgHearts = Array.from({ length: reduced ? 14 : 30 }, () => makeBgHeart(true));
    });

    /* ---------- Jedna pętla animacji dla wszystkich canvasów ---------- */

    let last = 0, rafId = 0;

    function frame(now) {
      rafId = requestAnimationFrame(frame);
      const dt = Math.max(0, Math.min((now - last) / 1000, 0.05));
      last = now;
      T += dt;

      if (stepColors(dt)) updateHeartColors();

      // Bicie serca; podczas niespodzianki szybsze i mocniejsze
      const boost = surprise.on ? 1.7 : 1;
      beatPhase = (beatPhase + dt / (surprise.on ? 0.75 : 1.1)) % 1;
      const beat = beatValue(beatPhase);
      wrapEl.style.scale = String(heartK * (1 + (reduced ? 0.05 : 0.13) * boost * beat));
      glowEl.style.opacity = String(0.55 + 0.45 * beat);

      // Środek sceny mierzymy z layoutu co klatkę (font, wysokość napisu, orientacja), więc B zawsze pokrywa się z A
      const rc = sceneEl.getBoundingClientRect();
      baseCx = rc.left + rc.width / 2;
      baseCy = rc.top + rc.height / 2 - shiftY;

      // W niespodziance serce maleje i wędruje w górę, ale zostaje min. ~30 px od góry ekranu
      const kTarget = surprise.on ? 0.85 : 1;
      const halfH = heartSize * 0.5 * kTarget * (1 + 0.13 * 1.7) + 4;
      const shiftTarget = surprise.on ? -Math.max(0, Math.min(H * 0.2, 150, baseCy - 30 - halfH)) : 0;
      if (Math.abs(shiftTarget - shiftY) > 0.05 || Math.abs(kTarget - heartK) > 0.001) {
        const kk = 1 - Math.exp(-dt * 3);
        shiftY += (shiftTarget - shiftY) * kk;
        heartK += (kTarget - heartK) * kk;
        sceneEl.style.translate = `0px ${shiftY.toFixed(1)}px`;
      }
      hcx = baseCx;
      hcy = baseCy + shiftY;

      // Deszcz serduszek przez kilka sekund
      if (surprise.rain > 0) {
        surprise.rain -= dt;
        surprise.acc += dt * (reduced ? 12 : 30);
        while (surprise.acc >= 1) { surprise.acc -= 1; spawnRain(); }
      }

      drawBg(dt);

      fxCtx.setTransform(1, 0, 0, 1, 0, 0);
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      updateParticles(dt, beat, (reduced ? 0.035 : 0.07) * boost);
      drawParticles();
      drawStreak(dt);
      updateDrawSprites(dt);
    }

    function run() {
      cancelAnimationFrame(rafId);
      last = performance.now();
      rafId = requestAnimationFrame(frame);
    }

    // Pauza, gdy karta jest ukryta
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelAnimationFrame(rafId);
      else run();
    });

    /* ---------- Start ---------- */

    makeHeartParticles();
    resize();
    setVariant(rand() < 0.5 ? 'A' : 'B', true);
    run();
  </script>
</body>
</html>
