<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kocham Cię ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2b0a18 0%, #0d0208 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      position: relative;
      cursor: pointer;
    }

    /* Tło z unoszącymi się cząsteczkami */
    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Scena 3D dla serca */
    .scene {
      width: 180px;
      height: 180px;
      perspective: 800px;
      z-index: 2;
      margin-bottom: 35px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .heart-wrapper {
      width: 140px;
      height: 140px;
      transform-style: preserve-3d;
      animation: spinAndBeat 6s infinite ease-in-out;
    }

    .heart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 25px var(--glow-color, #ff2a6d));
      transition: filter 1.2s ease;
    }

    .heart-path {
      fill: url(#heartGrad);
      transition: all 1.2s ease;
    }

    /* Animacja obrotu 3D i bicia serca */
    @keyframes spinAndBeat {
      0% {
        transform: rotateY(0deg) scale(1);
      }
      15% {
        transform: rotateY(54deg) scale(1.14);
      }
      30% {
        transform: rotateY(108deg) scale(1.02);
      }
      45% {
        transform: rotateY(162deg) scale(1.16);
      }
      60% {
        transform: rotateY(216deg) scale(1);
      }
      100% {
        transform: rotateY(360deg) scale(1);
      }
    }

    /* Napisy */
    .text-container {
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #love-text {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(3.2rem, 11vw, 5rem);
      font-weight: 400;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ff758c, #ff7eb3, #ffd1ff, #ff758c);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite, textFloat 3s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(255, 117, 140, 0.35);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #love-text.fade-out {
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
    }

    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }

    @keyframes textFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .hint {
      position: absolute;
      bottom: 28px;
      font-size: 0.78rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      z-index: 2;
      animation: pulseHint 2.5s infinite;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }

    /* Małe serduszka po kliknięciu */
    .burst-heart {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      font-size: 22px;
      animation: flyOut 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes flyOut {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.3) rotate(var(--rot));
      }
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="scene">
    <div class="heart-wrapper">
      <svg class="heart-svg" viewBox="0 0 32 29.6">
        <defs>
          <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop id="stop1" offset="0%" stop-color="#ff0844" />
            <stop id="stop2" offset="100%" stop-color="#ffb199" />
          </linearGradient>
        </defs>
        <path class="heart-path" d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
          c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
      </svg>
    </div>
  </div>

  <div class="text-container">
    <h1 id="love-text">Kocham Cię</h1>
  </div>

  <div class="hint">Dotknij ekranu ✨</div>

  <script>
    const targetName = "Asiu";

    // Bazy zdań – mogą pojawiać się z imieniem lub bez, losowo
    const basePhrases = [
      "Kocham Cię",
      "Jesteś moim światem",
      "Na zawsze razem ❤️",
      "Myślę o Tobie cały czas",
      "Dziękuję, że jesteś",
      "Jesteś moim szczęściem",
      "Moje serce bije dla Ciebie"
    ];

    function buildRandomMessage(previousText) {
      let candidate = "";
      let guard = 0;

      do {
        const phrase = basePhrases[Math.floor(Math.random() * basePhrases.length)];
        // Około 50% szans, że pojawi się imię "Asiu"
        const includeName = Math.random() < 0.5;

        if (includeName) {
          // Czasem samo imię / z imieniem na końcu lub początku
          const mode = Math.floor(Math.random() * 3);
          if (mode === 0) {
            candidate = `${phrase}, ${targetName}`;
          } else if (mode === 1) {
            candidate = `${targetName}, ${phrase.charAt(0).toLowerCase() + phrase.slice(1)}`;
          } else {
            candidate = `${targetName} ❤️`;
          }
        } else {
          candidate = phrase;
        }
        guard++;
      } while (candidate === previousText && guard < 15);

      return candidate;
    }

    const palettes = [
      { c1: '#ff0844', c2: '#ffb199', glow: '#ff2a6d', textGrad: 'linear-gradient(90deg, #ff758c, #ff7eb3, #ffd1ff, #ff758c)' },
      { c1: '#f83600', c2: '#f9d423', glow: '#ff9a00', textGrad: 'linear-gradient(90deg, #f6d365, #fda085, #fff1eb, #f6d365)' },
      { c1: '#b721ff', c2: '#21d4fd', glow: '#b721ff', textGrad: 'linear-gradient(90deg, #e0c3fc, #8ec5fc, #ffffff, #e0c3fc)' },
      { c1: '#ff057c', c2: '#8d0b93', glow: '#ff057c', textGrad: 'linear-gradient(90deg, #ff9a9e, #fecfef, #ffffff, #ff9a9e)' },
      { c1: '#e6b980', c2: '#eacda3', glow: '#e6b980', textGrad: 'linear-gradient(90deg, #f3e7e9, #e3eeff, #ffd1ff, #f3e7e9)' }
    ];

    let paletteIndex = 0;

    const loveTextEl = document.getElementById('love-text');
    const stop1 = document.getElementById('stop1');
    const stop2 = document.getElementById('stop2');
    const heartSvg = document.querySelector('.heart-svg');

    // Start od razu z losowym wariantem (z imieniem lub bez)
    loveTextEl.textContent = buildRandomMessage("");

    function applyPalette(idx) {
      const p = palettes[idx];
      stop1.setAttribute('stop-color', p.c1);
      stop2.setAttribute('stop-color', p.c2);
      heartSvg.style.setProperty('--glow-color', p.glow);
      loveTextEl.style.backgroundImage = p.textGrad;
    }

    // Automatyczna płynna zmiana kolorów co 4 sekundy
    setInterval(() => {
      paletteIndex = (paletteIndex + 1) % palettes.length;
      applyPalette(paletteIndex);
    }, 4000);

    // Zmiana napisu, koloru i eksplozja serduszek po dotknięciu
    function handleInteraction(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;

      // Eksplozja małych serduszek
      const emojis = ['❤️', '💖', '✨', '💕', '💗'];
      for (let i = 0; i < 10; i++) {
        const span = document.createElement('span');
        span.className = 'burst-heart';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        span.style.left = x + 'px';
        span.style.top = y + 'px';

        const angle = (Math.PI * 2 * i) / 10 + (Math.random() - 0.5) * 0.5;
        const dist = 60 + Math.random() * 90;
        span.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        span.style.setProperty('--ty', `${Math.sin(angle) * dist - 30}px`);
        span.style.setProperty('--rot', `${(Math.random() - 0.5) * 90}deg`);

        document.body.appendChild(span);
        setTimeout(() => span.remove(), 1100);
      }

      // Losowa zmiana tekstu (imię "Asiu" pojawia się losowo albo wcale)
      const nextText = buildRandomMessage(loveTextEl.textContent);
      loveTextEl.classList.add('fade-out');
      setTimeout(() => {
        loveTextEl.textContent = nextText;
        loveTextEl.classList.remove('fade-out');
      }, 300);

      // Zmiana koloru
      paletteIndex = (paletteIndex + 1) % palettes.length;
      applyPalette(paletteIndex);
    }

    document.body.addEventListener('click', handleInteraction);

    // Animacja unoszących się iskierek w tle
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function initParticles() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      particles = Array.from({ length: 45 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2 + 0.5,
        speedY: Math.random() * 0.6 + 0.2,
        alpha: Math.random() * 0.6 + 0.2
      }));
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.y -= p.speedY;
        if (p.y < 0) {
          p.y = height;
          p.x = Math.random() * width;
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 182, 193, ${p.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', initParticles);
    initParticles();
    animateParticles();
  </script>
</body>
</html>
